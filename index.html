<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calisthénie">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F1911">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Calisthénie Coach</title>
<style>
:root{
  --bg:#0F1911; --panel:#16231A; --card:#1D2E20; --card2:#233826;
  --line:#2E4230; --grass:#5D8F46;
  --sun:#FFD400; --ink:#F3EFE2; --muted:#9DB295;
  --pill-bg:#F6F3E8; --pill-ink:#141A14; --danger:#E4572E; --ok:#8FD14F;
  --disp:'Futura','Avenir Next Condensed','Trebuchet MS',-apple-system,sans-serif;
  --body:-apple-system,'Avenir Next','Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3,.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.03em;font-weight:800}
header.app{padding:18px 16px 10px;display:flex;align-items:baseline;justify-content:space-between}
header.app h1{font-size:22px;color:var(--sun)}
header.app .sub{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
main{padding:0 14px;max-width:640px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,25,17,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:50}
.tabbar button{flex:1;background:none;border:none;color:var(--muted);font-family:var(--disp);
  text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;padding:10px 2px 8px;cursor:pointer}
.tabbar button .ic{display:block;font-size:20px;margin-bottom:2px}
.tabbar button.on{color:var(--sun)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:6px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grass);font-weight:700;margin-bottom:4px}
.muted{color:var(--muted);font-size:13.5px}
.pill{display:inline-block;background:var(--pill-bg);color:var(--pill-ink);font-family:var(--disp);
  font-weight:800;border-radius:10px;padding:2px 10px;font-size:14px}
.badge-sun{display:inline-block;background:var(--sun);color:#171500;font-family:var(--disp);font-weight:800;
  border-radius:8px;padding:2px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.btn{display:inline-block;border:none;border-radius:12px;font-family:var(--disp);font-weight:800;
  text-transform:uppercase;letter-spacing:.05em;font-size:13px;padding:11px 16px;cursor:pointer}
.btn.sun{background:var(--sun);color:#171500}
.btn.ghost{background:transparent;color:var(--sun);border:1.5px solid var(--sun)}
.btn.dim{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.wide{width:100%;text-align:center}
.btn.sm{font-size:11px;padding:7px 10px;border-radius:9px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;
  background:linear-gradient(180deg,#1B3A22 0%,#27502B 55%,#3C6B33 100%);padding:20px 16px 16px}
.hero h2{font-size:24px;line-height:1.15;color:#fff}
.hero .accent{color:var(--sun)}
.hero p{color:#DCEBCF;font-size:13px;margin-top:8px}
/* Suggestion / évolution */
.sugg{background:linear-gradient(90deg,#3A3410,#2A2A12);border:1.5px solid var(--sun);border-radius:16px;padding:13px 14px;margin-bottom:12px}
.sugg h3{color:var(--sun);font-size:13px;margin-bottom:4px}
.sugg p{font-size:13px;margin-bottom:9px}
/* MOVES */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}
.mcard .ill{display:block;width:100%}
.mcard .cap{padding:8px 10px 10px}
.mcard .cap .nm{font-family:var(--disp);text-transform:uppercase;font-weight:800;font-size:12.5px}
.mcard .cap .ms{font-size:10.5px;color:var(--muted)}
/* MODAL */
.modal{position:fixed;inset:0;background:rgba(6,10,7,.7);display:none;align-items:flex-end;z-index:100}
.modal.on{display:flex}
.sheet{background:var(--panel);border-radius:20px 20px 0 0;width:100%;max-width:640px;margin:0 auto;
  max-height:88vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:19px;margin-bottom:2px}
ol.steps{margin:8px 0 0 18px}
ol.steps li{margin-bottom:6px;font-size:14px}
ul.dots{margin:6px 0 0 18px}
ul.dots li{margin-bottom:5px;font-size:13.5px;color:var(--muted)}
.sec{margin-top:14px}
.chain{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chain span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px}
.chain span.now{background:var(--sun);color:#171500;font-weight:700;border-color:var(--sun)}
.objopt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:10px;color:var(--ink);cursor:pointer;font-family:var(--body)}
.objopt.on{border-color:var(--sun);background:#2A2A12}
.objopt .t{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:13px}
.objopt .d{font-size:12.5px;color:var(--muted);margin-top:2px}
/* PROGRAMME */
.sess{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:var(--card)}
.sess .head{padding:12px 14px;background:linear-gradient(90deg,#27502B,#1D2E20);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sess .head h3{font-size:15px;color:#fff}
.exline{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.exline .thumb{width:66px;border-radius:10px;overflow:hidden;flex-shrink:0}
.exline .thumb svg{display:block;width:100%}
.exline .nm{font-family:var(--disp);text-transform:uppercase;font-weight:800;font-size:12px;line-height:1.2}
.exline .sub{font-size:10.5px;color:var(--muted)}
.exline input{width:76px;background:var(--card2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:5px 6px;font-family:var(--disp);font-weight:700;text-align:center;font-size:13px}
.exline .del{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:4px}
.sess .foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-direction:column}
select.addex{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px;font-size:14px}
/* SESSION */
.runill{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:10px 0}
.runill svg{display:block;width:100%}
@media (prefers-reduced-motion:no-preference){.runill svg{animation:breathe 4s ease-in-out infinite}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
.setrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.setbtn{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);
  color:var(--ink);font-family:var(--disp);font-weight:800;font-size:15px;cursor:pointer}
.setbtn.done{background:var(--ok);border-color:var(--ok);color:#12210A}
.hitbtn{margin-top:10px;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);
  border-radius:12px;padding:10px 12px;color:var(--ink);font-size:13px;cursor:pointer;font-family:var(--body)}
.hitbtn.on{border-color:var(--sun);background:#2A2A12}
.timer{font-family:var(--disp);font-weight:800;font-size:44px;text-align:center;color:var(--sun);margin:6px 0}
.prog{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--sun);transition:width .3s}
/* SUIVI */
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat .v{font-family:var(--disp);font-weight:800;font-size:26px;color:var(--sun)}
.stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.lvlbar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--sun))}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.badge .e{font-size:22px}
.badge .n{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.badge.won{border-color:var(--sun)}
.badge.won .n{color:var(--ink)}
.badge:not(.won){opacity:.4;filter:grayscale(1)}
.hline{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.hline .d{color:var(--muted);font-size:12px}
details.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.pcard summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
details.pcard summary::-webkit-details-marker{display:none}
details.pcard summary .num{font-family:var(--disp);font-weight:800;color:var(--sun);font-size:16px;width:26px}
details.pcard summary h3{font-size:14px}
details.pcard .body{padding:0 14px 14px;font-size:14px}
details.pcard .body p{margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--sun);color:#171500;
  font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.05em;
  padding:10px 16px;border-radius:12px;z-index:200;display:none;max-width:86vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="app">
  <div><h1>Calisthénie&nbsp;Coach</h1><div class="sub" id="hsub">Programme d'Adrien</div></div>
</header>
<main id="main"></main>

<nav class="tabbar">
  <button data-tab="cours"><span class="ic">🎓</span>Cours</button>
  <button data-tab="moves"><span class="ic">💪</span>Mouvements</button>
  <button data-tab="prog" class="on"><span class="ic">📋</span>Programme</button>
  <button data-tab="suivi"><span class="ic">📈</span>Suivi</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ILLUSTRATIONS v2 — style pictogramme sportif
   Silhouettes aux proportions réalistes, membre éloigné estompé,
   short contrasté, ombre au sol, flèches de mouvement.
   ============================================================ */
const BODY='#182030', FAR='#3B4A63', SHORT='#4A5E80', ARROW='#B98600';
function scene(id){
  let s='';
  s+='<defs><linearGradient id="sky'+id+'" x1="0" y1="0" x2="0" y2="1">'
   +'<stop offset="0" stop-color="#C6DCA3"/><stop offset=".6" stop-color="#93B871"/>'
   +'<stop offset="1" stop-color="#79A25C"/></linearGradient></defs>';
  s+='<rect width="220" height="140" fill="url(#sky'+id+')"/>';
  s+='<circle cx="192" cy="18" r="22" fill="#F7E27A" opacity=".55"/>';
  s+='<path d="M0,26 Q22,8 44,22 Q64,4 88,18 Q110,2 134,16 Q158,4 180,18 Q200,8 220,20 L220,0 L0,0 Z" fill="#2F5B33" opacity=".9"/>';
  s+='<rect y="112" width="220" height="28" fill="#5E8A45"/>';
  s+='<rect y="112" width="220" height="3" fill="#4C7538"/>';
  return s;
}
function mat(){ return '<rect x="24" y="105" width="172" height="13" rx="6.5" fill="#F0B429"/>'
  +'<rect x="24" y="105" width="172" height="4.5" rx="2.2" fill="#F8CE60"/>'; }
function shadow(cx,rx){ return '<ellipse cx="'+cx+'" cy="114" rx="'+rx+'" ry="4.5" fill="#243B1F" opacity=".35"/>'; }
function stroke(d,w,c){ return '<path d="'+d+'" fill="none" stroke="'+(c||BODY)+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>'; }
function head(x,y){ return '<circle cx="'+x+'" cy="'+y+'" r="9" fill="'+BODY+'"/>'; }
function tri(x,y,dir){
  const m={u:'M'+x+','+y+' l-4.5,7 h9 z', d:'M'+x+','+y+' l-4.5,-7 h9 z',
           l:'M'+x+','+y+' l7,-4.5 v9 z', r:'M'+x+','+y+' l-7,-4.5 v9 z'};
  return '<path d="'+m[dir]+'" fill="'+ARROW+'"/>';
}
function arrV(x,y1,y2){ return stroke('M'+x+','+(y1+6)+' L'+x+','+(y2-6),2.4,ARROW).replace('/>',' stroke-dasharray="3 4"/>')+tri(x,y1,'u')+tri(x,y2,'d'); }
function arrUp(x,y1,y2){ return stroke('M'+x+','+(y1+6)+' L'+x+','+y2,2.4,ARROW).replace('/>',' stroke-dasharray="3 4"/>')+tri(x,y1,'u'); }
function arrDown(x,y1,y2){ return stroke('M'+x+','+y1+' L'+x+','+(y2-6),2.4,ARROW).replace('/>',' stroke-dasharray="3 4"/>')+tri(x,y2,'d'); }
function arrH(x1,x2,y){ return stroke('M'+(x1+6)+','+y+' L'+(x2-6)+','+y,2.4,ARROW).replace('/>',' stroke-dasharray="3 4"/>')+tri(x1,y,'l')+tri(x2,y,'r'); }
function hold(x,y){ return '<circle cx="'+x+'" cy="'+y+'" r="9" fill="none" stroke="'+ARROW+'" stroke-width="2.4"/>'
  +stroke('M'+x+','+y+' L'+x+','+(y-5.5),2.2,ARROW)+stroke('M'+x+','+y+' L'+(x+4)+','+y,2.2,ARROW); }
function bench(x,w,y){
  return '<rect x="'+(x+5)+'" y="'+(y+7)+'" width="7" height="'+(112-y-7)+'" rx="2" fill="#6B4A28"/>'
   +'<rect x="'+(x+w-12)+'" y="'+(y+7)+'" width="7" height="'+(112-y-7)+'" rx="2" fill="#6B4A28"/>'
   +'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="8" rx="3.5" fill="#8A6134"/>'
   +'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="3" rx="1.5" fill="#A67C46"/>';
}
function lowbar(x,w,y){
  return '<rect x="'+x+'" y="'+y+'" width="4.5" height="'+(112-y)+'" rx="2" fill="#55606C"/>'
   +'<rect x="'+(x+w-4.5)+'" y="'+y+'" width="4.5" height="'+(112-y)+'" rx="2" fill="#55606C"/>'
   +'<rect x="'+(x-4)+'" y="'+y+'" width="'+(w+8)+'" height="5" rx="2.5" fill="#2E3640"/>';
}
function hibar(x,w,y){
  return '<rect x="'+(x-2)+'" y="'+y+'" width="5" height="'+(112-y)+'" rx="2" fill="#55606C"/>'
   +'<rect x="'+(x+w-3)+'" y="'+y+'" width="5" height="'+(112-y)+'" rx="2" fill="#55606C"/>'
   +'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="5" rx="2.5" fill="#2E3640"/>';
}

/* Une fonction de dessin par exercice — coordonnées travaillées à la main */
const DRAW = {
pompe(){ return mat()+shadow(104,62)
  + stroke('M142,93 L152,105 L145,113',7,FAR)                       /* bras éloigné */
  + stroke('M106,99 L80,107 L54,113',8,FAR)                          /* jambe éloignée */
  + stroke('M150,90 C136,93 122,96 108,97',13)                       /* tronc */
  + stroke('M108,97 L82,104 L56,111',9) + stroke('M56,111 L48,113',6)/* jambe + pied */
  + stroke('M110,97 L94,101',12,SHORT)                               /* short */
  + stroke('M148,91 L158,103 L150,112',7.5)                          /* bras */
  + head(164,84) + arrV(180,80,110); },
pompe_inc(){ return bench(130,62,90)+mat()+shadow(96,58)
  + stroke('M134,64 L142,78 L147,90',7,FAR)
  + stroke('M98,84 L74,98 L52,112',8,FAR)
  + stroke('M138,62 C126,69 113,76 100,83',13)
  + stroke('M100,83 L76,96 L54,110',9) + stroke('M54,110 L46,112',6)
  + stroke('M102,83 L88,91',12,SHORT)
  + stroke('M136,63 L146,77 L151,89',7.5)
  + head(151,53) + arrV(170,52,80); },
pike(){ return mat()+shadow(112,60)
  + stroke('M82,81 L72,97 L64,112',7,FAR)
  + stroke('M124,49 L145,82 L164,112',8,FAR)
  + stroke('M86,78 C98,64 110,53 122,48',13)
  + stroke('M122,48 L142,80 L160,110',9)
  + stroke('M122,48 L131,62',12,SHORT)
  + stroke('M84,80 L74,96 L66,111',7.5)
  + head(76,94) + arrV(44,80,108); },
dips(){ return bench(122,70,78)+mat()+shadow(88,56)
  + stroke('M113,74 L126,93 L132,81',7,FAR)
  + stroke('M106,97 L76,102 L48,111',8,FAR)
  + stroke('M116,72 C114,80 111,88 108,96',13)
  + stroke('M108,96 L78,101 L50,110',9) + stroke('M50,110 L44,105',6)
  + stroke('M108,96 L95,98',12,SHORT)
  + stroke('M117,73 L130,92 L136,80',7.5)
  + head(119,56) + arrV(94,58,86); },
squat(){ return mat()+shadow(105,42)
  + stroke('M100,65 L120,68 L138,66',6.5,FAR)
  + stroke('M90,89 L114,94 L110,113',8,FAR)
  + stroke('M102,62 C99,71 95,80 92,88',13)
  + stroke('M92,88 L116,92 L112,112',9) + stroke('M112,112 L126,112',6)
  + stroke('M92,88 L104,90',12,SHORT)
  + stroke('M102,64 L122,66 L140,63',7)
  + head(101,50) + arrV(66,58,100); },
fente(){ return mat()+shadow(102,52)
  + stroke('M104,49 L96,66',6.5,FAR)
  + stroke('M101,76 L80,100 L62,110',8,FAR)
  + stroke('M106,46 C105,55 104,65 103,74',13)
  + stroke('M103,74 L127,92 L127,112',9) + stroke('M127,112 L140,112',6)
  + stroke('M103,74 L82,98 L64,108',9) + stroke('M64,108 L57,111',6)
  + stroke('M103,74 L113,82',12,SHORT)
  + stroke('M106,48 L114,66',7)
  + head(106,34) + arrV(158,58,100); },
bulg(){ return bench(136,58,86)+mat()+shadow(90,40)
  + stroke('M92,52 L100,70',6.5,FAR)
  + stroke('M100,78 L126,100 L147,87',8,FAR)
  + stroke('M94,50 C96,59 97,68 98,76',13)
  + stroke('M98,76 L82,94 L83,112',9) + stroke('M83,112 L70,112',6)
  + stroke('M98,76 L124,98 L146,85',9)
  + stroke('M98,76 L91,86',12,SHORT)
  + stroke('M95,52 L90,70',7)
  + head(92,38) + arrV(58,52,96); },
bridge(){ return mat()+shadow(96,58)
  + stroke('M62,102 L86,109',6.5,FAR)
  + stroke('M106,84 L130,82 L136,111',8,FAR)
  + stroke('M60,101 C76,95 90,88 104,82',13)
  + stroke('M104,82 L128,80 L134,110',9) + stroke('M134,110 L145,110',6)
  + stroke('M104,82 L117,81',12,SHORT)
  + stroke('M62,101 L84,108',7)
  + head(45,104) + arrUp(104,58,76); },
planche(){ return mat()+shadow(104,62)
  + stroke('M137,85 L138,106 L160,107',7,FAR)
  + stroke('M102,91 L76,100 L50,110',8,FAR)
  + stroke('M140,83 C128,86 116,88 104,90',13)
  + stroke('M104,90 L78,99 L52,109',9) + stroke('M52,109 L45,111',6)
  + stroke('M106,90 L92,94',12,SHORT)
  + stroke('M139,84 L140,105 L163,106',7.5)
  + head(156,77) + hold(38,38); },
side(){ return mat()+shadow(112,58)
  + stroke('M74,86 L92,80 L104,88',6)
  + stroke('M72,86 C86,88 99,90 112,92',13)
  + stroke('M112,92 L160,105',9) + stroke('M160,105 L167,101',6)

/* ================= NIVEAUX & BADGES ================= */
const LEVELS=[{n:'Fondations',min:0},{n:'Construction',min:12},{n:'Performance',min:30},{n:'Maîtrise',min:60}];
function levelInfo(){
  const c=state.history.length;
  let i=0; LEVELS.forEach((l,k)=>{ if(c>=l.min) i=k; });
  const next=LEVELS[i+1];
  return {name:LEVELS[i].n, idx:i, count:c, next:next, pct: next?Math.round((c-LEVELS[i].min)/(next.min-LEVELS[i].min)*100):100};
}
function weekKey(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x.toISOString().slice(0,10); }
function badges(){
  const h=state.history, weeks={};
  h.forEach(x=>{ const k=weekKey(x.date); weeks[k]=(weeks[k]||0)+1; });
  const wkeys=Object.keys(weeks).sort();
  let streak=0,best=0;
  for(let i=0;i<wkeys.length;i++){
    if(i>0){ const prev=new Date(wkeys[i-1]); prev.setDate(prev.getDate()+7);
      streak = (prev.toISOString().slice(0,10)===wkeys[i]) ? streak+1 : 1; }
    else streak=1;
    if(streak>best) best=streak;
  }
  return [
   {e:'🌱',n:'Première séance',ok:h.length>=1},
   {e:'🔥',n:'5 séances',ok:h.length>=5},
   {e:'💪',n:'10 séances',ok:h.length>=10},
   {e:'🏆',n:'25 séances',ok:h.length>=25},
   {e:'📅',n:'Semaine 3/3',ok:Object.values(weeks).some(v=>v>=3)},
   {e:'⚡',n:'3 sem. d\'affilée',ok:best>=3}
  ];
}

/* ================= MOTEUR D'ÉVOLUTION ================= */
function bumpReps(r){
  if(/s/.test(r)) return r.replace(/\d+/g, m=>parseInt(m)+5);   /* durées : +5 s */
  return r.replace(/\d+/g, m=>parseInt(m)+2);                    /* reps : +2 */
}
function suggestions(){
  const out=[];
  Object.keys(state.exlog).forEach(k=>{
    if(state.exlog[k]>=2 && EX[k]){
      state.prog.sessions.forEach((s,si)=>{ s.items.forEach((it,ii)=>{
        if(it.ex===k) out.push({ex:k,si:si,ii:ii,reps:it.reps});
      });});
    }
  });
  const seen={}; return out.filter(o=>{ if(seen[o.ex])return false; seen[o.ex]=true; return true; });
}
function applyBump(k){
  state.prog.sessions.forEach(s=>s.items.forEach(it=>{ if(it.ex===k) it.reps=bumpReps(it.reps); }));
  state.exlog[k]=0; save(); toast(EX[k].n+' : objectif augmenté 📈'); renderProg();
}
function dismissSugg(k){ state.exlog[k]=0; save(); renderProg(); }
function nextSession(){
  const order=state.prog.sessions.map(s=>s.id);
  if(!state.history.length) return order[0];
  const last=state.history[0].sess, i=order.indexOf(last);
  return order[(i+1)%order.length] || order[0];
}

function renderCours(){
  let h = '<div class="hero"><div class="eyebrow" style="color:#BFE39A">Cours introductif</div>'
    + '<h2>La callisthénie,<br>c\'est <span class="accent">ton corps</span><br>comme seule machine</h2>'
    + '<p>Force, muscle et contrôle avec le poids du corps. 7 principes à connaître — tape sur chaque carte.</p></div>';
  COURSE.forEach((c,i)=>{
    h += '<details class="pcard"><summary><span class="num">'+String(i+1).padStart(2,'0')+'</span><h3>'+c.t+'</h3></summary><div class="body">'+c.b+'</div></details>';
  });
  M.innerHTML=h;
}

/* ================= MOUVEMENTS ================= */
function renderMoves(){
  let h = '<div class="card" style="background:linear-gradient(90deg,#27502B,#1D2E20)"><div class="eyebrow" style="color:#BFE39A">Bibliothèque</div><h3>Les mouvements de base</h3><p class="muted" style="color:#DCEBCF">15 exercices fondamentaux. Tape une carte pour la fiche complète.</p></div>';
  const cats = {};
  Object.keys(EX).forEach(k=>{ const c=EX[k].cat; (cats[c]=cats[c]||[]).push(k); });
  Object.keys(cats).forEach(c=>{
    h += '<div class="eyebrow" style="margin:14px 2px 8px">'+c+'</div><div class="mgrid">';
    cats[c].forEach(k=>{
      h += '<div class="mcard" onclick="openEx(\''+k+'\')"><span class="ill">'+figSVG(k)+'</span>'
        +'<div class="cap"><div class="nm">'+EX[k].n+'</div><div class="ms">'+EX[k].ms+'</div></div></div>';
    });
    h += '</div>';
  });
  M.innerHTML=h;
}
function openEx(k){
  const e=EX[k];
  let h = '<div class="handle"></div>'+figSVG(k,600).replace('<svg','<svg style="border-radius:14px;display:block;width:100%;margin-bottom:12px"')
   + '<div class="eyebrow">'+e.cat+'</div><h2>'+e.n+'</h2><div class="muted">'+e.ms+'</div>'
   + '<div class="sec"><div class="eyebrow">Exécution</div><ol class="steps">'+e.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol></div>'
   + '<div class="sec"><div class="eyebrow">Erreurs fréquentes</div><ul class="dots">'+e.err.map(s=>'<li>'+s+'</li>').join('')+'</ul></div>'
   + '<div class="sec"><div class="eyebrow">Chaîne de progression</div><div class="chain">'
   + e.chain.map(c=>'<span class="'+(c===e.n?'now':'')+'">'+c+'</span>').join('<span style="border:none;background:none;color:#5D8F46">→</span>')+'</div></div>'
   + '<div style="margin-top:16px"><button class="btn dim wide" onclick="closeModal()">Fermer</button></div>';
  document.getElementById('sheet').innerHTML=h;
  document.getElementById('modal').classList.add('on');
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

/* ================= OBJECTIF ================= */
function openObj(){
  let h='<div class="handle"></div><h2>Ton objectif</h2><p class="muted" style="margin-bottom:12px">Changer d\'objectif charge un programme adapté. Ton historique et tes badges sont conservés.</p>';
  Object.keys(OBJ).forEach(k=>{
    h+='<button class="objopt '+(k===state.objective?'on':'')+'" onclick="setObj(\''+k+'\')">'
      +'<div class="t">'+(k===state.objective?'● ':'')+OBJ[k].t+'</div><div class="d">'+OBJ[k].d+'</div></button>';
  });
  h+='<button class="btn dim wide" onclick="closeModal()">Fermer</button>';
  document.getElementById('sheet').innerHTML=h;
  document.getElementById('modal').classList.add('on');
}
function setObj(k){
  if(k===state.objective){ closeModal(); return; }
  if(!confirm('Passer à « '+OBJ[k].t+' » ?\nLe programme actuel sera remplacé par le programme adapté (les séances personnalisées seront perdues, l\'historique est conservé).')) return;
  state.objective=k;
  state.prog=JSON.parse(JSON.stringify(PROGS[k]));
  state.exlog={};
  save(); closeModal(); render();
  toast('Objectif : '+OBJ[k].t+' ✔');
}

/* ================= PROGRAMME ================= */
function renderProg(){
  const lvl=levelInfo(), nx=nextSession();
  let h = '<div class="hero"><div class="eyebrow" style="color:#BFE39A">Ton programme · Niveau '+lvl.name+'</div>'
    + '<h2>'+state.prog.name+'</h2>'
    + '<p>3 séances / semaine · repos '+OBJ[state.objective].rest+' s entre séries · échauffement 5 min.'
    + (state.history.length?'<br>Prochaine séance conseillée : <b style="color:var(--sun)">Séance '+nx+'</b>':'')+'</p>'
    + '<div style="margin-top:10px"><button class="btn sun sm" onclick="openObj()">🎯 Objectif : '+OBJ[state.objective].t+' ▾</button></div></div>';

  /* Suggestions d'évolution */
  suggestions().forEach(sg=>{
    h += '<div class="sugg"><h3>📈 Évolution débloquée — '+EX[sg.ex].n+'</h3>'
      +'<p>Haut de fourchette atteint sur 2 séances de suite ('+sg.reps+'). Le moment de monter d\'un cran :</p>'
      +'<div class="row"><button class="btn sun sm" onclick="applyBump(\''+sg.ex+'\')">+ Augmenter l\'objectif</button>'
      +'<button class="btn ghost sm" onclick="openEx(\''+sg.ex+'\')">Variante supérieure</button>'
      +'<button class="btn dim sm" onclick="dismissSugg(\''+sg.ex+'\')">Plus tard</button></div></div>';
  });

  h += '<div class="row" style="margin-bottom:12px"><button class="btn '+(editing?'sun':'ghost')+' grow" onclick="toggleEdit()">'+(editing?'✓ Enregistrer les modifications':'✎ Modifier le programme')+'</button>'
    + (editing?'<button class="btn danger" onclick="resetProg()">Réinit.</button>':'')+'</div>';
  state.prog.sessions.forEach((s,si)=>{
    const isNext = s.id===nx && state.history.length;
    h += '<div class="sess"'+(isNext?' style="border-color:var(--sun)"':'')+'><div class="head"><h3>'+s.title+'</h3><span class="badge-sun">'+(isNext?'▶ À toi':s.hint)+'</span></div>';
    s.items.forEach((it,ii)=>{
      const e=EX[it.ex]; if(!e) return;
      h += '<div class="exline"><div class="thumb">'+figSVG(it.ex,66)+'</div>'
        + '<div class="grow"><div class="nm">'+e.n+'</div><div class="sub">'+e.ms+'</div></div>';
      if(editing){
        h += '<input value="'+it.sets+'×'+it.reps+'" onchange="editItem('+si+','+ii+',this.value)" aria-label="séries et répétitions">'
          + '<button class="del" onclick="delItem('+si+','+ii+')" aria-label="supprimer">✕</button>';
      } else {
        h += '<span class="pill">'+it.sets+'×'+it.reps+'</span>';
      }
      h += '</div>';
    });
    if(editing){
      h += '<div class="foot"><select class="addex" onchange="addItem('+si+',this.value);this.value=\'\'">'
        + '<option value="">+ Ajouter un exercice…</option>'
        + Object.keys(EX).map(k=>'<option value="'+k+'">'+EX[k].n+'</option>').join('')+'</select></div>';
    } else {
      h += '<div class="foot"><button class="btn sun wide" onclick="startRun('+si+')">▶ Démarrer la séance '+s.id+'</button></div>';
    }
    h += '</div>';
  });
  h += '<p class="muted" style="margin:4px 2px 16px">💡 En séance, valide tes séries puis coche « Haut de fourchette atteint » quand c\'est le cas : après 2 séances réussies, l\'appli te proposera automatiquement d\'évoluer.</p>';
  M.innerHTML=h;
}
function toggleEdit(){ editing=!editing; if(!editing){ save(); toast('Programme enregistré'); } renderProg(); }
function editItem(si,ii,v){
  const parts = v.includes('×') ? v.split('×') : v.split('x');
  const it=state.prog.sessions[si].items[ii];
  if(parts.length>1){ it.sets=parseInt(parts[0])||it.sets; it.reps=parts.slice(1).join('x').trim(); }
  else { it.reps=v.trim(); }
}
function delItem(si,ii){ state.prog.sessions[si].items.splice(ii,1); renderProg(); }
function addItem(si,k){ if(!k) return; state.prog.sessions[si].items.push({ex:k,sets:3,reps:'10'}); renderProg(); }
function resetProg(){ if(confirm('Revenir au programme d\'origine de cet objectif ?')){ state.prog=JSON.parse(JSON.stringify(PROGS[state.objective])); editing=false; save(); renderProg(); } }

/* ================= MODE SÉANCE ================= */
function startRun(si){
  const s=state.prog.sessions[si];
  run={si:si, idx:0, done:s.items.map(it=>Array(it.sets).fill(false)), hit:s.items.map(()=>false), start:Date.now(), rest:0};
  renderRun();
}
function renderRun(){
  const s=state.prog.sessions[run.si], it=s.items[run.idx], e=EX[it.ex];
  const total=s.items.length, rest=OBJ[state.objective].rest;
  let h='<div>'
   +'<div class="row"><button class="btn dim" onclick="quitRun()">✕ Quitter</button>'
   +'<div class="grow" style="text-align:right"><span class="eyebrow">'+s.title+'</span></div></div>'
   +'<div class="prog"><i style="width:'+Math.round((run.idx)/total*100)+'%"></i></div>'
   +'<div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.1em">Exercice '+(run.idx+1)+' / '+total+'</div>'
   +'<h2 style="font-size:22px;margin-top:2px">'+e.n+'</h2>'
   +'<div class="row" style="margin-top:4px"><span class="pill">'+it.sets+'×'+it.reps+'</span><span class="muted" style="font-size:12px">'+e.ms+'</span></div>'
   +'<div class="runill">'+figSVG(it.ex,600)+'</div>';
  if(run.rest>0){
    h+='<div class="eyebrow" style="text-align:center">Repos</div><div class="timer">'+run.rest+'<span style="font-size:20px">s</span></div>'
      +'<button class="btn ghost wide" onclick="skipRest()">Passer le repos</button>';
  } else {
    h+='<div class="eyebrow">Valide chaque série</div><div class="setrow">';
    run.done[run.idx].forEach((d,k)=>{
      h+='<button class="setbtn '+(d?'done':'')+'" onclick="tickSet('+k+')">'+(d?'✓':(k+1))+'</button>';
    });
    h+='</div>'
     +'<button class="hitbtn '+(run.hit[run.idx]?'on':'')+'" onclick="tickHit()">'+(run.hit[run.idx]?'🎯 Haut de fourchette atteint — noté !':'🎯 Haut de fourchette atteint ? Tape ici si oui')+'</button>'
     +'<p class="muted" style="margin-top:8px;font-size:12.5px">Tempo 2-1-2, amplitude complète. Repos '+rest+' s entre séries.</p>';
  }
  h+='<div style="margin-top:14px" class="row">'
    +(run.idx>0?'<button class="btn dim" onclick="moveRun(-1)">◀</button>':'')
    +(run.idx<total-1
      ?'<button class="btn sun grow" onclick="moveRun(1)">Exercice suivant ▶</button>'
      :'<button class="btn sun grow" onclick="finishRun()">🏁 Terminer la séance</button>')
    +'</div></div>';
  M.innerHTML=h;
}
function tickSet(k){
  run.done[run.idx][k]=!run.done[run.idx][k];
  if(run.done[run.idx][k] && run.done[run.idx].some(x=>!x)){ startRest(OBJ[state.objective].rest); } else { renderRun(); }
}
function tickHit(){ run.hit[run.idx]=!run.hit[run.idx]; renderRun(); }
function startRest(sec){ run.rest=sec; clearInterval(timerH);
  timerH=setInterval(()=>{ if(!run){ clearInterval(timerH); return; } run.rest--; if(run.rest<=0){ clearInterval(timerH); run.rest=0; } renderRun(); },1000);
  renderRun(); }
function skipRest(){ clearInterval(timerH); run.rest=0; renderRun(); }
function moveRun(d){ clearInterval(timerH); run.rest=0; run.idx=Math.max(0,Math.min(state.prog.sessions[run.si].items.length-1,run.idx+d)); renderRun(); }
function quitRun(){ if(confirm('Quitter sans enregistrer la séance ?')){ clearInterval(timerH); run=null; render(); } }
function finishRun(){
  clearInterval(timerH);
  const s=state.prog.sessions[run.si];
  const setsDone=run.done.flat().filter(Boolean).length;
  const setsTotal=run.done.flat().length;
  const mins=Math.max(1,Math.round((Date.now()-run.start)/60000));
  const prevLvl=levelInfo().name;
  state.history.unshift({date:new Date().toISOString(), sess:s.id, title:s.title, sets:setsDone, total:setsTotal, mins:mins});
  /* moteur d'évolution : réussites par exercice */
  s.items.forEach((it,i)=>{
    if(run.hit[i]) state.exlog[it.ex]=(state.exlog[it.ex]||0)+1;
    else state.exlog[it.ex]=0;
  });
  const newLvl=levelInfo().name;
  save(); run=null;
  tab='suivi';
  document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='suivi'));
  render();
  if(newLvl!==prevLvl) toast('🎖 Nouveau niveau : '+newLvl+' !');
  else if(suggestions().length) toast('Séance enregistrée — une évolution t\'attend dans Programme 📈');
  else toast('Séance '+s.id+' enregistrée — bravo ! 💪');
}

/* ================= SUIVI ================= */
function renderSuivi(){
  const now=new Date();
  const monday=new Date(now); monday.setHours(0,0,0,0); monday.setDate(now.getDate()-((now.getDay()+6)%7));
  const week=state.history.filter(x=>new Date(x.date)>=monday).length;
  const lvl=levelInfo();
  let h='<div class="hero"><div class="eyebrow" style="color:#BFE39A">Suivi</div><h2>Niveau <span class="accent">'+lvl.name+'</span></h2>'
    +'<div class="lvlbar"><i style="width:'+lvl.pct+'%"></i></div>'
    +'<p>'+(lvl.next?(lvl.next.min-lvl.count)+' séance(s) avant le niveau « '+lvl.next.n+' »':'Niveau maximum atteint — respect. 🏔')+'</p></div>';
  h+='<div class="grid2" style="margin-bottom:12px">'
    +'<div class="stat"><div class="v">'+week+'<span style="font-size:15px;color:var(--muted)"> / 3</span></div><div class="l">Cette semaine</div></div>'
    +'<div class="stat"><div class="v">'+state.history.length+'</div><div class="l">Séances au total</div></div></div>';
  h+='<div class="card"><h3>Badges</h3><div class="bgrid" style="margin-top:8px">';
  badges().forEach(b=>{ h+='<div class="badge '+(b.ok?'won':'')+'"><div class="e">'+b.e+'</div><div class="n">'+b.n+'</div></div>'; });
  h+='</div></div>';
  h+='<div class="card"><h3>Historique</h3>';
  if(!state.history.length){ h+='<p class="muted">Aucune séance pour l\'instant. Lance ta première depuis l\'onglet Programme — t\'es partant ? 😉</p>'; }
  state.history.slice(0,30).forEach(x=>{
    const d=new Date(x.date);
    h+='<div class="hline"><div><b>Séance '+x.sess+'</b> · '+x.sets+'/'+x.total+' séries<div class="d">'+d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+' · '+x.mins+' min</div></div><span class="badge-sun">✓</span></div>';
  });
  h+='</div>';
  if(state.history.length) h+='<button class="btn danger wide" style="margin-top:4px" onclick="clearHist()">Effacer l\'historique</button>';
  M.innerHTML=h;
}
function clearHist(){ if(confirm('Effacer tout l\'historique ?')){ state.history=[]; state.exlog={}; save(); renderSuivi(); } }

load();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
